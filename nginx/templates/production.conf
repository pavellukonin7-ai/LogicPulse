resolver 127.0.0.11 valid=30s ipv6=off;
ssl_protocols TLSv1.2 TLSv1.3;
ssl_session_cache shared:TLS:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;
server_tokens off;
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=metrics:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=requests:10m rate=6r/m;
server {
    listen 8081;
    server_name _;
    location = /healthz { access_log off; return 200 "ok\n"; }
}
server {
    listen 80;
    server_name __DOMAIN__;
    location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 403; }
}
server {
    listen 443 ssl;
    server_name __DOMAIN__;
    ssl_certificate /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    client_max_body_size 32k;
    location ~ ^/api/auth/(register|login|token)$ {
        limit_req zone=login burst=5 nodelay;
        limit_req_status 429;
        set $backend http://backend:8000;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
    location /api/metrics/ {
        limit_req zone=metrics burst=10 nodelay;
        limit_req_status 429;
        set $backend http://backend:8000;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
    location = /api/requests {
        limit_req zone=requests burst=5 nodelay;
        limit_req_status 429;
        set $backend http://backend:8000;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
    location /api/ {
        set $backend http://backend:8000;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
    # Swagger assets are hosted locally; no dependency on a public CDN.
    location = /docs {
        set $backend http://backend:8000;
        proxy_pass $backend;
        # Swagger uses one inline initialization script; this exception is only /docs.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options nosniff always;
    }
    location = /openapi.json {
        set $backend http://backend:8000;
        proxy_pass $backend;
    }
    location /assets/ {
        try_files $uri =404;
        expires 7d;
    }
    location /swagger/ { try_files $uri =404; }
    location / { try_files $uri $uri/ =404; }
    location ~ /\. { deny all; }
}
