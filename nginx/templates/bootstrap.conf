server {
    listen 8081;
    server_name _;
    location = /healthz { access_log off; return 200 "ok\n"; }
}
server {
    listen 80;
    server_name __DOMAIN__;
    server_tokens off;
    location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { default_type text/plain; return 503 "LogicPulse: HTTPS setup in progress.\n"; }
}
